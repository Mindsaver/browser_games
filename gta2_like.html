<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Mayhem - Single File GTA-style Game</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }
    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #1a1a1a;
      cursor: crosshair;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const WORLD_SIZE = 3600;
  const ROAD_GAP = 300; // Distance between city road center lines.
  const ROAD_WIDTH = 115; // Width of each road corridor.
  const HALF_WORLD = WORLD_SIZE / 2;
  const SAFEHOUSE = { x: -HALF_WORLD + 220, y: -HALF_WORLD + 220, r: 90 };
  const REQUIRED_PACKAGES = 6;
  const GAME_TIME = 240;
  const MAX_NORMAL_SPEED = 330;
  const MAX_BOOST_SPEED = 470;
  const BASE_TURN_RATE = 2.75;
  const SPEED_TURN_DIVISOR = 210;
  const MAX_SPEED_TURN_BONUS = 1.8;
  const TRAFFIC_BASE_DAMAGE = 14;
  const SPEED_DIFF_DAMAGE_MULTIPLIER = 0.025;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  const keys = {};
  let mouse = { x: 0, y: 0 };
  let shootPressed = false;

  window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === " ") e.preventDefault();
    if ((e.key === "r" || e.key === "R") && (state.gameOver || state.win)) resetGame();
  });
  window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
  canvas.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  canvas.addEventListener("mousedown", () => shootPressed = true);
  canvas.addEventListener("mouseup", () => shootPressed = false);

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function rand(min, max) { return Math.random() * (max - min) + min; }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function wrap(v) {
    if (v < -HALF_WORLD) return HALF_WORLD;
    if (v > HALF_WORLD) return -HALF_WORLD;
    return v;
  }

  function colorWithAlpha(color, alpha) {
    if (color.startsWith("#")) {
      const hex = color.slice(1);
      const normalized = hex.length === 3
        ? hex.split("").map(ch => ch + ch).join("")
        : hex;
      if (normalized.length === 6) {
        const r = parseInt(normalized.slice(0, 2), 16);
        const g = parseInt(normalized.slice(2, 4), 16);
        const b = parseInt(normalized.slice(4, 6), 16);
        return `rgba(${r},${g},${b},${alpha})`;
      }
    }
    if (color.startsWith("rgb(")) {
      return color.replace("rgb(", "rgba(").replace(")", `,${alpha})`);
    }
    if (color.startsWith("rgba(")) {
      return color.replace(/rgba\((\d+\s*,\s*\d+\s*,\s*\d+)\s*,[^)]*\)/, `rgba($1,${alpha})`);
    }
    return `rgba(255,160,60,${alpha})`;
  }

  function isRoadCoord(v) {
    let mod = ((v + HALF_WORLD) % ROAD_GAP + ROAD_GAP) % ROAD_GAP;
    mod = Math.min(mod, ROAD_GAP - mod);
    return mod < ROAD_WIDTH * 0.5;
  }
  function isRoad(x, y) { return isRoadCoord(x) || isRoadCoord(y); }

  const buildings = [];
  for (let x = -HALF_WORLD; x < HALF_WORLD; x += ROAD_GAP) {
    for (let y = -HALF_WORLD; y < HALF_WORLD; y += ROAD_GAP) {
      const cx = x + ROAD_GAP * 0.5;
      const cy = y + ROAD_GAP * 0.5;
      const maxW = ROAD_GAP - ROAD_WIDTH - 26;
      const maxH = ROAD_GAP - ROAD_WIDTH - 26;
      buildings.push({
        x: cx + rand(-20, 20),
        y: cy + rand(-20, 20),
        w: clamp(maxW + rand(-24, 24), 110, 170),
        h: clamp(maxH + rand(-24, 24), 110, 170),
      });
    }
  }

  function circleRectCollision(cx, cy, r, rect) {
    const rx = rect.x - rect.w / 2;
    const ry = rect.y - rect.h / 2;
    const px = clamp(cx, rx, rx + rect.w);
    const py = clamp(cy, ry, ry + rect.h);
    const dx = cx - px, dy = cy - py;
    return dx * dx + dy * dy < r * r;
  }

  function collidesBuilding(x, y, r) {
    for (const b of buildings) {
      if (Math.abs(b.x - x) > b.w / 2 + r + 50 || Math.abs(b.y - y) > b.h / 2 + r + 50) continue;
      if (circleRectCollision(x, y, r, b)) return true;
    }
    return false;
  }

  const state = {};
  function resetGame() {
    state.player = {
      x: SAFEHOUSE.x + 100,
      y: SAFEHOUSE.y + 60,
      angle: 0,
      speed: 0,
      radius: 16,
      health: 100,
      wanted: 0,
      cash: 0,
      shootCooldown: 0,
      boostCooldown: 0
    };
    state.camera = { x: state.player.x, y: state.player.y };
    state.traffic = [];
    state.police = [];
    state.bullets = [];
    state.explosions = [];
    state.packages = 0;
    state.packageTarget = spawnPackage();
    state.timeLeft = GAME_TIME;
    state.score = 0;
    state.gameOver = false;
    state.win = false;
    spawnTraffic(34);
  }

  function randomRoadPoint() {
    for (let i = 0; i < 200; i++) {
      const x = rand(-HALF_WORLD + 120, HALF_WORLD - 120);
      const y = rand(-HALF_WORLD + 120, HALF_WORLD - 120);
      if (isRoad(x, y) && !collidesBuilding(x, y, 20) && Math.hypot(x - SAFEHOUSE.x, y - SAFEHOUSE.y) > 260) {
        return { x, y };
      }
    }
    return { x: 0, y: 0 };
  }

  function spawnPackage() {
    const p = randomRoadPoint();
    return { x: p.x, y: p.y, r: 14 };
  }

  function spawnTraffic(count) {
    for (let i = 0; i < count; i++) {
      const p = randomRoadPoint();
      const horizontal = Math.random() < 0.5;
      state.traffic.push({
        x: p.x,
        y: p.y,
        angle: horizontal ? (Math.random() < 0.5 ? 0 : Math.PI) : (Math.random() < 0.5 ? Math.PI / 2 : -Math.PI / 2),
        speed: rand(70, 160),
        radius: 12,
        hp: 1
      });
    }
  }

  function spawnPolice() {
    const p = randomRoadPoint();
    state.police.push({
      x: p.x,
      y: p.y,
      angle: 0,
      speed: 120,
      radius: 14,
      hp: 3,
      hitCooldown: 0
    });
  }

  function addExplosion(x, y, color = "#f90") {
    state.explosions.push({ x, y, life: 0.4, maxLife: 0.4, color });
  }

  function shoot() {
    const p = state.player;
    if (p.shootCooldown > 0) return;
    const worldMouseX = state.camera.x + (mouse.x - canvas.width / 2);
    const worldMouseY = state.camera.y + (mouse.y - canvas.height / 2);
    const a = Math.atan2(worldMouseY - p.y, worldMouseX - p.x);
    state.bullets.push({
      x: p.x + Math.cos(a) * 22,
      y: p.y + Math.sin(a) * 22,
      vx: Math.cos(a) * 800,
      vy: Math.sin(a) * 800,
      life: 0.85
    });
    p.shootCooldown = 0.18;
    p.wanted = clamp(p.wanted + 0.15, 0, 5);
  }

  function updatePlayer(dt) {
    const p = state.player;
    const forward = (keys["w"] || keys["arrowup"]) ? 1 : 0;
    const backward = (keys["s"] || keys["arrowdown"]) ? 1 : 0;
    const left = (keys["a"] || keys["arrowleft"]) ? 1 : 0;
    const right = (keys["d"] || keys["arrowright"]) ? 1 : 0;
    const handbrake = keys[" "];
    const boost = keys["shift"];

    const accel = 520;
    const friction = handbrake ? 0.9 : 0.97;
    const maxSpeed = boost && p.boostCooldown <= 0 ? MAX_BOOST_SPEED : MAX_NORMAL_SPEED;

    p.speed += (forward - backward) * accel * dt;
    p.speed *= Math.pow(friction, dt * 60);
    p.speed = clamp(p.speed, -180, maxSpeed);

    const steer = (right - left);
    p.angle += steer * (BASE_TURN_RATE + Math.min(Math.abs(p.speed) / SPEED_TURN_DIVISOR, MAX_SPEED_TURN_BONUS)) * dt * (p.speed >= 0 ? 1 : -1);
    p.shootCooldown = Math.max(0, p.shootCooldown - dt);
    p.boostCooldown = Math.max(0, p.boostCooldown - dt);

    if (boost && p.boostCooldown <= 0) {
      p.speed += 120;
      p.boostCooldown = 2.2;
    }

    const oldX = p.x, oldY = p.y;
    p.x += Math.cos(p.angle) * p.speed * dt;
    p.y += Math.sin(p.angle) * p.speed * dt;
    p.x = wrap(p.x);
    p.y = wrap(p.y);

    if (collidesBuilding(p.x, p.y, p.radius)) {
      p.x = oldX;
      p.y = oldY;
      p.speed *= -0.35;
      p.health -= 7;
      addExplosion(p.x, p.y, "#fa4");
    }
  }

  function updateTraffic(dt) {
    for (const t of state.traffic) {
      if (Math.random() < 0.008) {
        const turn = Math.random() < 0.5 ? Math.PI / 2 : -Math.PI / 2;
        t.angle += turn;
      }
      t.x += Math.cos(t.angle) * t.speed * dt;
      t.y += Math.sin(t.angle) * t.speed * dt;
      t.x = wrap(t.x);
      t.y = wrap(t.y);

      if (!isRoad(t.x, t.y) || collidesBuilding(t.x, t.y, t.radius)) {
        t.angle += Math.PI;
        t.x += Math.cos(t.angle) * 18;
        t.y += Math.sin(t.angle) * 18;
      }

      const d = Math.hypot(t.x - state.player.x, t.y - state.player.y);
      if (d < t.radius + state.player.radius) {
        state.player.health -= TRAFFIC_BASE_DAMAGE * dt + Math.abs(state.player.speed - t.speed) * SPEED_DIFF_DAMAGE_MULTIPLIER;
        state.player.speed *= 0.96;
        state.player.wanted = clamp(state.player.wanted + 0.35 * dt, 0, 5);
      }
    }
  }

  function updatePolice(dt) {
    const desired = Math.floor(state.player.wanted * 2);
    while (state.police.length < desired) spawnPolice();
    while (state.police.length > desired) state.police.pop();

    for (const c of state.police) {
      const dx = state.player.x - c.x;
      const dy = state.player.y - c.y;
      const target = Math.atan2(dy, dx);
      let diff = target - c.angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      c.angle += clamp(diff, -2.2 * dt, 2.2 * dt);
      c.speed = 170 + state.player.wanted * 40;
      c.x += Math.cos(c.angle) * c.speed * dt;
      c.y += Math.sin(c.angle) * c.speed * dt;

      if (collidesBuilding(c.x, c.y, c.radius)) {
        c.x -= Math.cos(c.angle) * c.speed * dt;
        c.y -= Math.sin(c.angle) * c.speed * dt;
        c.angle += Math.PI / 2;
      }

      c.x = wrap(c.x);
      c.y = wrap(c.y);
      c.hitCooldown = Math.max(0, c.hitCooldown - dt);

      const d = Math.hypot(c.x - state.player.x, c.y - state.player.y);
      if (d < c.radius + state.player.radius + 3 && c.hitCooldown <= 0) {
        state.player.health -= 7 + state.player.wanted * 2;
        state.player.speed *= 0.85;
        c.hitCooldown = 0.55;
      }
    }
  }

  function updateBullets(dt) {
    for (let i = state.bullets.length - 1; i >= 0; i--) {
      const b = state.bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if (b.life <= 0 || collidesBuilding(b.x, b.y, 2)) {
        state.bullets.splice(i, 1);
        continue;
      }

      let hit = false;
      for (let j = state.police.length - 1; j >= 0; j--) {
        const c = state.police[j];
        if (Math.hypot(b.x - c.x, b.y - c.y) < c.radius + 3) {
          c.hp--;
          state.bullets.splice(i, 1);
          hit = true;
          addExplosion(c.x, c.y, "#7cf");
          if (c.hp <= 0) {
            state.police.splice(j, 1);
            state.player.cash += 120;
            state.score += 100;
            state.player.wanted = clamp(state.player.wanted - 0.4, 0, 5);
          }
          break;
        }
      }
      if (hit) continue;
    }
  }

  function updateMission(dt) {
    state.timeLeft -= dt;
    if (state.timeLeft <= 0) {
      state.timeLeft = 0;
      state.gameOver = true;
    }

    const p = state.player;
    if (state.packages < REQUIRED_PACKAGES) {
      if (Math.hypot(p.x - state.packageTarget.x, p.y - state.packageTarget.y) < p.radius + state.packageTarget.r + 8) {
        state.packages++;
        state.player.cash += 90;
        state.score += 75;
        state.player.wanted = clamp(state.player.wanted + 0.45, 0, 5);
        state.packageTarget = spawnPackage();
      }
    } else {
      if (Math.hypot(p.x - SAFEHOUSE.x, p.y - SAFEHOUSE.y) < SAFEHOUSE.r) {
        state.win = true;
      }
    }

    state.player.wanted = Math.max(0, state.player.wanted - 0.05 * dt);
    if (state.player.health <= 0) {
      state.player.health = 0;
      state.gameOver = true;
    }
  }

  function updateExplosions(dt) {
    for (let i = state.explosions.length - 1; i >= 0; i--) {
      state.explosions[i].life -= dt;
      if (state.explosions[i].life <= 0) state.explosions.splice(i, 1);
    }
  }

  function drawRoadGrid(camX, camY) {
    const minX = camX - canvas.width / 2 - ROAD_GAP;
    const maxX = camX + canvas.width / 2 + ROAD_GAP;
    const minY = camY - canvas.height / 2 - ROAD_GAP;
    const maxY = camY + canvas.height / 2 + ROAD_GAP;

    ctx.fillStyle = "#2a2a2a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#3a3a3a";
    ctx.lineWidth = 1;
    for (let x = Math.floor((minX + HALF_WORLD) / ROAD_GAP) * ROAD_GAP - HALF_WORLD; x <= maxX; x += ROAD_GAP) {
      const sx = x - camX + canvas.width / 2;
      ctx.fillStyle = "#4a4a4a";
      ctx.fillRect(sx - ROAD_WIDTH / 2, 0, ROAD_WIDTH, canvas.height);
      for (let y = -canvas.height; y < canvas.height * 2; y += 40) {
        ctx.fillStyle = "#f5f5a5";
        ctx.fillRect(sx - 2, y, 4, 20);
      }
    }
    for (let y = Math.floor((minY + HALF_WORLD) / ROAD_GAP) * ROAD_GAP - HALF_WORLD; y <= maxY; y += ROAD_GAP) {
      const sy = y - camY + canvas.height / 2;
      ctx.fillStyle = "#4a4a4a";
      ctx.fillRect(0, sy - ROAD_WIDTH / 2, canvas.width, ROAD_WIDTH);
      for (let x = -canvas.width; x < canvas.width * 2; x += 40) {
        ctx.fillStyle = "#f5f5a5";
        ctx.fillRect(x, sy - 2, 20, 4);
      }
    }
  }

  function drawBuildings(camX, camY) {
    for (const b of buildings) {
      const sx = b.x - camX + canvas.width / 2;
      const sy = b.y - camY + canvas.height / 2;
      if (sx < -b.w || sy < -b.h || sx > canvas.width + b.w || sy > canvas.height + b.h) continue;
      ctx.fillStyle = "#1f2024";
      ctx.fillRect(sx - b.w / 2, sy - b.h / 2, b.w, b.h);
      ctx.fillStyle = "#2d2f36";
      ctx.fillRect(sx - b.w / 2 + 7, sy - b.h / 2 + 7, b.w - 14, b.h - 14);
    }
  }

  function drawCar(x, y, angle, color, size = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(size, size);
    ctx.fillStyle = color;
    ctx.fillRect(-16, -10, 32, 20);
    ctx.fillStyle = "#111";
    ctx.fillRect(-12, -7, 24, 14);
    ctx.fillStyle = "#8ad";
    ctx.fillRect(5, -6, 8, 12);
    ctx.restore();
  }

  function drawWorld() {
    const camX = state.camera.x;
    const camY = state.camera.y;
    drawRoadGrid(camX, camY);
    drawBuildings(camX, camY);

    const safeX = SAFEHOUSE.x - camX + canvas.width / 2;
    const safeY = SAFEHOUSE.y - camY + canvas.height / 2;
    ctx.beginPath();
    ctx.fillStyle = "rgba(60,220,90,0.22)";
    ctx.strokeStyle = "rgba(130,255,150,0.8)";
    ctx.lineWidth = 2;
    ctx.arc(safeX, safeY, SAFEHOUSE.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    if (state.packages < REQUIRED_PACKAGES) {
      const px = state.packageTarget.x - camX + canvas.width / 2;
      const py = state.packageTarget.y - camY + canvas.height / 2;
      ctx.fillStyle = "#ffd54d";
      ctx.fillRect(px - 11, py - 11, 22, 22);
      ctx.fillStyle = "#a96";
      ctx.fillRect(px - 7, py - 7, 14, 14);
    }

    for (const t of state.traffic) {
      drawCar(t.x - camX + canvas.width / 2, t.y - camY + canvas.height / 2, t.angle, "#d8d8d8", 0.9);
    }
    for (const c of state.police) {
      drawCar(c.x - camX + canvas.width / 2, c.y - camY + canvas.height / 2, c.angle, "#4f82ff", 1.0);
      const sx = c.x - camX + canvas.width / 2;
      const sy = c.y - camY + canvas.height / 2;
      ctx.fillStyle = "#f44";
      ctx.fillRect(sx - 10, sy - 20, 20 * (c.hp / 3), 3);
    }
    for (const b of state.bullets) {
      ctx.fillStyle = "#ffec9a";
      ctx.beginPath();
      ctx.arc(b.x - camX + canvas.width / 2, b.y - camY + canvas.height / 2, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const e of state.explosions) {
      const t = e.life / e.maxLife;
      ctx.fillStyle = colorWithAlpha(e.color, t);
      ctx.beginPath();
      ctx.arc(e.x - camX + canvas.width / 2, e.y - camY + canvas.height / 2, 34 * (1 - t + 0.2), 0, Math.PI * 2);
      ctx.fill();
    }

    const p = state.player;
    drawCar(canvas.width / 2, canvas.height / 2, p.angle, "#ff5050", 1.1);
  }

  function drawHUD() {
    const p = state.player;
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(14, 14, 360, 126);
    ctx.fillStyle = "#fff";
    ctx.font = "18px Arial";
    ctx.fillText(`Health: ${Math.ceil(p.health)}`, 28, 42);
    ctx.fillText(`Wanted: ${"★".repeat(Math.floor(p.wanted + 0.5)).padEnd(5, "☆")}`, 28, 68);
    ctx.fillText(`Cash: $${p.cash}`, 28, 94);
    ctx.fillText(`Time: ${Math.ceil(state.timeLeft)}s`, 28, 120);
    ctx.fillText(`Packages: ${state.packages}/${REQUIRED_PACKAGES}`, 190, 42);
    ctx.fillText(`Score: ${state.score}`, 190, 68);

    const speed = Math.abs(p.speed);
    ctx.fillStyle = "#333";
    ctx.fillRect(190, 95, 160, 16);
    ctx.fillStyle = "#78d9ff";
    ctx.fillRect(190, 95, clamp(speed / MAX_BOOST_SPEED, 0, 1) * 160, 16);
    ctx.strokeStyle = "#000";
    ctx.strokeRect(190, 95, 160, 16);

    const objective = state.packages < REQUIRED_PACKAGES
      ? "Objective: Collect packages."
      : "Objective: Return to safehouse.";
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(14, canvas.height - 54, 370, 40);
    ctx.fillStyle = "#bfffbf";
    ctx.fillText(objective, 26, canvas.height - 27);

    drawMiniMap();
  }

  function drawMiniMap() {
    const w = 180, h = 180;
    const x0 = canvas.width - w - 16;
    const y0 = 16;
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(x0, y0, w, h);
    ctx.strokeStyle = "#bbb";
    ctx.strokeRect(x0, y0, w, h);

    function mapX(x) { return x0 + ((x + HALF_WORLD) / WORLD_SIZE) * w; }
    function mapY(y) { return y0 + ((y + HALF_WORLD) / WORLD_SIZE) * h; }

    ctx.fillStyle = "#555";
    for (let i = -HALF_WORLD; i <= HALF_WORLD; i += ROAD_GAP) {
      ctx.fillRect(mapX(i) - 1, y0, 2, h);
      ctx.fillRect(x0, mapY(i) - 1, w, 2);
    }
    ctx.fillStyle = "#6f6";
    ctx.beginPath();
    ctx.arc(mapX(SAFEHOUSE.x), mapY(SAFEHOUSE.y), 4, 0, Math.PI * 2);
    ctx.fill();

    if (state.packages < REQUIRED_PACKAGES) {
      ctx.fillStyle = "#fd5";
      ctx.beginPath();
      ctx.arc(mapX(state.packageTarget.x), mapY(state.packageTarget.y), 3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = "#4f82ff";
    for (const c of state.police) {
      ctx.fillRect(mapX(c.x) - 2, mapY(c.y) - 2, 4, 4);
    }
    ctx.fillStyle = "#ff5959";
    ctx.beginPath();
    ctx.arc(mapX(state.player.x), mapY(state.player.y), 4, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawEndScreen() {
    if (!state.gameOver && !state.win) return;
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = "center";
    ctx.fillStyle = state.win ? "#8eff8e" : "#ff8e8e";
    ctx.font = "56px Arial";
    ctx.fillText(state.win ? "MISSION COMPLETE" : "BUSTED", canvas.width / 2, canvas.height / 2 - 35);
    ctx.fillStyle = "#fff";
    ctx.font = "24px Arial";
    ctx.fillText(`Final Score: ${state.score}`, canvas.width / 2, canvas.height / 2 + 8);
    ctx.fillText(`Cash: $${state.player.cash}`, canvas.width / 2, canvas.height / 2 + 40);
    ctx.fillText("Press R to restart", canvas.width / 2, canvas.height / 2 + 88);
    ctx.textAlign = "left";
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;

    if (!state.gameOver && !state.win) {
      if (shootPressed || keys["j"]) shoot();
      updatePlayer(dt);
      updateTraffic(dt);
      updatePolice(dt);
      updateBullets(dt);
      updateMission(dt);
      updateExplosions(dt);

      state.camera.x += (state.player.x - state.camera.x) * 0.15;
      state.camera.y += (state.player.y - state.camera.y) * 0.15;
    }

    drawWorld();
    drawHUD();
    drawEndScreen();

    requestAnimationFrame(loop);
  }

  resetGame();
  requestAnimationFrame(loop);
})();
</script>
